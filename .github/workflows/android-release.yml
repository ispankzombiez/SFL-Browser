name: Android Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: android-release

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the runner's Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is missing from the runner}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.1.0/apksigner" ||
                ! -x "$ANDROID_HOME/build-tools/36.1.0/aapt2" ]]; then
            echo "::error::This runner needs Android SDK Platform 36 and Build Tools 36.1.0."
            exit 1
          fi

      - name: Configure crash reporting
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          : "${FIREBASE_GOOGLE_SERVICES_JSON:?Missing FIREBASE_GOOGLE_SERVICES_JSON secret}"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest -PrequireCrashReporting=true

      - name: Build and verify signed APK
        id: apk
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KEYSTORE_PATH
          KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/sfl-release.XXXXXX")
          trap 'rm -f -- "$KEYSTORE_PATH" signing.properties' EXIT
          : "${RELEASE_KEYSTORE:?Missing RELEASE_KEYSTORE secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"

          python3 - <<'PY'
          import os
          from pathlib import Path

          keys = {
              "RELEASE_STORE_FILE": "KEYSTORE_PATH",
              "RELEASE_STORE_PASSWORD": "KEYSTORE_PASSWORD",
              "RELEASE_KEY_ALIAS": "KEY_ALIAS",
              "RELEASE_KEY_PASSWORD": "KEY_PASSWORD",
          }
          # Java Properties reads Unicode escapes, including whitespace and backslashes.
          def escape(value):
              units = value.encode("utf-16-be").hex()
              return "".join("\\u" + units[i:i + 4] for i in range(0, len(units), 4))

          Path("signing.properties").write_text(
              "".join(f"{key}={escape(os.environ[env])}\n" for key, env in keys.items()),
              encoding="ascii",
          )
          PY
          unset RELEASE_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD

          bash ./gradlew --no-daemon :app:assembleRelease -PrequireCrashReporting=true
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.1.0"
          signature=$("$tools/apksigner" verify --verbose --print-certs "$apk")
          fingerprint=$(printf '%s\n' "$signature" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p')
          # Match the published GitHub APK (v1.0.044), not the separate local signing key.
          if [[ "$fingerprint" != 9a728508601ca148b1c9369fd73fef4dfbf25cde592e3bf4540b86ade49c4fdb ]] ||
             ! grep -Fxq 'Number of signers: 1' <<< "$signature"; then
            echo "::error::Expected exactly one signer matching the published GitHub APK. APK certificate SHA-256: ${fingerprint:-not reported}"
            exit 1
          fi
          badging=$("$tools/aapt2" dump badging "$apk")
          package=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          version=$(printf '%s\n' "$badging" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          if [[ "$package" != com.sfl.browser || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APK has an unexpected application ID or version name."
            exit 1
          fi
          asset="app/build/outputs/apk/release/sfl-browser-v${version}.apk"
          mv "$apk" "$asset"
          printf 'version=%s\nasset=%s\n' "$version" "$asset" >> "$GITHUB_OUTPUT"

      - name: Upload the signed APK's Crashlytics mapping
        run: >
          bash ./gradlew --no-daemon :app:uploadCrashlyticsMappingFileRelease
          -PrequireCrashReporting=true -PuploadCrashlyticsMapping=true

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: SFL Browser v${{ steps.apk.outputs.version }}
          body: Signed SFL Browser ${{ steps.apk.outputs.version }} APK.
          files: ${{ steps.apk.outputs.asset }}
          fail_on_unmatched_files: true

      - name: Recreate the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.asset }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::The replacement APK is missing or empty. The latest release was not changed."
            exit 1
          fi

          repo_api="repos/$GITHUB_REPOSITORY"
          release_id=$(gh api --paginate "$repo_api/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "latest") | .id')
          if [[ -n "$release_id" && ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected a single release ID for the latest tag."
            exit 1
          fi
          if [[ -n "$release_id" ]]; then
            immutable=$(gh api "$repo_api/releases/$release_id" --jq '.immutable')
            if [[ "$immutable" != false ]]; then
              echo "::error::The existing latest release must be mutable to replace it."
              exit 1
            fi
          fi

          latest_ref="$repo_api/git/refs/tags/latest"
          previous_sha=$(gh api "$repo_api/git/matching-refs/tags/latest" \
            --jq '.[] | select(.ref == "refs/tags/latest") | .object.sha')
          if [[ -z "$previous_sha" ]]; then
            gh api --method POST "$repo_api/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" --silent
          elif [[ "$previous_sha" != "$GITHUB_SHA" ]]; then
            gh api --method PATCH "$latest_ref" -f sha="$GITHUB_SHA" -F force=true --silent
          fi

          # Editing a published release does not update its publication date.
          if [[ -n "$release_id" ]]; then
            gh api --method DELETE "$repo_api/releases/$release_id" --silent
          fi
          gh release create latest "$APK_PATH" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "SFL Browser (Latest)" --notes "Version: $VERSION" --latest

          published_id=$(gh api "$repo_api/releases/tags/latest" --jq 'select(.published_at != null) | .id')
          tag_sha=$(gh api "$latest_ref" --jq '.object.sha')
          assets=$(gh api "$repo_api/releases/tags/latest" --jq '.assets[] | [.name, .state, .digest] | @tsv')
          digest=$(sha256sum "$APK_PATH")
          expected="${APK_PATH##*/}"$'\t'uploaded$'\t'"sha256:${digest%% *}"
          if [[ ! "$published_id" =~ ^[0-9]+$ || "$published_id" == "$release_id" \
                || "$tag_sha" != "$GITHUB_SHA" || "$assets" != "$expected" ]]; then
            echo "::error::Expected a new latest release at $GITHUB_SHA with exactly one matching APK."
            exit 1
          fi
