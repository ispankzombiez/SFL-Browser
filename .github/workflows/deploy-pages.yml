name: Deploy GitHub Pages

on:
  push:
    branches:
      - iphone-dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1) Isolated branch checkouts
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout iphone-dev branch
        uses: actions/checkout@v4
        with:
          ref: iphone-dev
          path: dev-site

      # 2) Side-by-side assembly
      - name: Assemble Pages content
        run: |
          set -euo pipefail
          mkdir -p _site

          # Keep the production homepage/site intact at the root
          if [ -d "main-site/docs" ]; then
            cp -R main-site/docs/. _site/
          else
            cp -R main-site/. _site/
          fi

          # Add the iphone-dev widget portal side-by-side
          mkdir -p _site/ios-widget
          cp -R dev-site/docs/ios-widget/. _site/ios-widget/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
